[project]
name = "videomaker"
version = "0.1.0"
description = "AI 视频制作工具链：分镜 → 关键帧 → 分段生成（尾帧接力）→ 拼接 → 发布"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "requests>=2.28",
  "click>=8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vm = "videomaker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["videomaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
